# Compose wrapper for the RamTool container.
#
# The image is built by the Dockerfile; this exists to make the two things people
# actually want easy:
#
#   docker compose build          build the payload in the container
#   docker compose run --rm tools copy the payload out to ./build and ./dist
#
# Driving real hardware needs the serial device passed through, which is what the
# `flash` service does. Serial passthrough is reliable on a Linux Docker host and
# unreliable under Docker Desktop on Windows and macOS, so `flash` is a profile
# rather than a default:
#
#   docker compose --profile flash run --rm flash
#
# A `docker compose build` writes the payload into the image, not into ./build:
# build.ps1 writes next to itself, and no volume exists at build time. The
# `tools` service is the way out - it copies the image's artifacts through a
# bind mount onto the host, refreshing ./build and ./dist:
#
#   docker compose build
#   docker compose run --rm tools
#
# Then run the payload from the host, where the serial device is. Without
# compose, the same copy is `docker cp <container>:/src/build/. build/`.

services:
  # Delivers the built payload to the host. A build writes into the image; this
  # copies it out, so the host runs exactly what was built without a toolchain.
  tools:
    build:
      context: .
      dockerfile: Dockerfile
    image: ramtool
    volumes:
      # Mounted at /out, not /src/build, so the image's own artifacts are the
      # source and these host directories are the destination. Writes through a
      # bind mount do reach the host.
      - ./build:/out/build
      - ./dist:/out/dist
    command:
      - sh
      - -c
      - |
        set -e
        mkdir -p /out/build /out/dist
        cp -a /src/build/. /out/build/
        cp -a /src/dist/. /out/dist/
        ls -l /out/build

  flash:
    profiles: ["flash"]
    build:
      context: .
      dockerfile: Dockerfile
    image: ramtool
    # Override with: docker compose --profile flash run --rm -e PORT=/dev/ttyACM0 flash
    environment:
      RAMTOOL_PORT: "${PORT:-/dev/ttyUSB0}"
    devices:
      # The host's serial device, by path. Override with -e and editing this if
      # yours is not /dev/ttyUSB0.
      - "/dev/ttyUSB0:/dev/ttyUSB0"
    volumes:
      # Shadows the image's /src/build, so run.py loads the host's build/
      # directory. Refresh it first with `docker compose run --rm tools`.
      - ./build:/src/build
    # Interactive: the payload keeps running until Ctrl-C.
    stdin_open: true
    tty: true
    command: ["python3", "run.py", "--port", "${PORT:-/dev/ttyUSB0}"]

  # Windows has no way to pass a COM port in, so reach the chip over TCP instead.
  # Start the bridge on the host first:
  #     python tools/serial_bridge.py --port COM7 --listen 5000
  # then:
  #     docker compose --profile winflash run --rm winflash
  winflash:
    profiles: ["winflash"]
    build:
      context: .
      dockerfile: Dockerfile
    image: ramtool
    extra_hosts:
      # Needed for a plain Docker Engine; Docker Desktop provides it already.
      - "host.docker.internal:host-gateway"
    environment:
      RAMTOOL_PORT: "${PORT:-socket://host.docker.internal:5000}"
    stdin_open: true
    tty: true
    command: ["python3", "run.py", "--port", "${PORT:-socket://host.docker.internal:5000}"]